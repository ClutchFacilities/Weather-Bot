name: Daily Weather Channel Post

# NOTE: this file must live at .github/workflows/weekly-weather.yml in your
# repo for GitHub Actions to pick it up - move it there after adding to git.
# (Filename/job name still say "weekly" for historical reasons.)
#
# This workflow has NO `schedule:` trigger. GitHub's native cron scheduler
# turned out to be unreliable for this job - real runs landed 70-90+ minutes
# late, multiple days in a row (see "Setting up the daily trigger" in the
# guide for the full diagnosis). Instead, an external scheduler (cron-job.org)
# calls the `workflow_dispatch` trigger below via GitHub's REST API at
# exactly 6:30 AM every day - see the guide for full setup steps.

on:
  workflow_dispatch: {} # triggered by the external scheduler daily, or manually from the Actions tab for testing

jobs:
  send-weather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python weekly_weather_slack.py
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
